[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --strict-config
    --alluredir=allure-results
    --clean-alluredir

markers =
    smoke: critical-path checks, run on every PR
    regression: full regression suite
    ui: pure UI tests
    hybrid: state prepared via API/storage, verified via UI

xfail_strict = true
log_level = INFO
