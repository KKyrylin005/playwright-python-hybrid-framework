[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --strict-config
    --alluredir=allure-results
    --clean-alluredir

markers =
    smoke: critical-path checks, run on every PR
    regression: full regression suite
    ui: pure UI tests
    hybrid: state prepared via API/storage, verified via UI
    api: pure API tests, no browser
    unit: tests of the framework's own code, no network
    cart(*product_names): hybrid tests only - pre-fill the cart via localStorage

xfail_strict = true
log_level = INFO
