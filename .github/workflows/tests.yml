name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "2.5.1"
  ALLURE_VERSION: "2.46.1"

jobs:
  lint:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx install "poetry==${POETRY_VERSION}"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry
      - run: poetry check --lock
      - run: poetry install --no-interaction
      - run: poetry run ruff check --output-format=github .
      - run: poetry run ruff format --check .
      - name: Unit tests (framework code, no browser)
        run: poetry run pytest -m unit
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: allure-results-unit
          path: allure-results
          retention-days: 7

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      E2E_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - run: pipx install "poetry==${POETRY_VERSION}"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry
      - run: poetry install --no-interaction --only main
      - run: poetry run playwright install --with-deps ${{ matrix.browser }}
      - name: Run UI and hybrid tests
        run: >
          poetry run pytest -m "ui or hybrid" -n auto
          --reruns 1 --only-rerun TimeoutError
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: traces-${{ matrix.browser }}
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

  api:
    name: API (Restful-Booker)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: pipx install "poetry==${POETRY_VERSION}"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry
      - run: poetry install --no-interaction --only main
      - run: poetry run pytest -m api
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: allure-results-api
          path: allure-results
          retention-days: 7

  docker:
    name: Docker image smoke
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: saucedemo-e2e:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run smoke tests inside the image
        run: docker run --rm --ipc=host saucedemo-e2e:ci -m "smoke and not api" -p no:cacheprovider

  report:
    name: Allure report
    needs: [lint, e2e, api]
    # Publish even when tests fail (that is when the report matters most), but only from main
    if: >
      !cancelled() && needs.lint.result == 'success'
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - id: pages
        uses: actions/configure-pages@v6

      - name: Restore trend history from the published report
        run: |
          mkdir -p allure-results/history
          for file in history.json history-trend.json duration-trend.json \
                      categories-trend.json retry-trend.json; do
            curl -sfL "${{ steps.pages.outputs.base_url }}/history/${file}" \
              -o "allure-results/history/${file}" || true
          done
          find allure-results/history -type f -empty -delete

      - name: Write report metadata
        run: |
          cat > allure-results/environment.properties <<EOF
          Browsers=chromium, firefox, webkit
          Python=${PYTHON_VERSION}
          Commit=${GITHUB_SHA::7}
          EOF
          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildOrder": ${GITHUB_RUN_NUMBER},
            "buildName": "Run #${GITHUB_RUN_NUMBER}",
            "buildUrl": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "reportUrl": "${{ steps.pages.outputs.base_url }}"
          }
          EOF

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate report
        run: |
          curl -sSfL -o allure.tgz \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar -xzf allure.tgz
          "./allure-${ALLURE_VERSION}/bin/allure" generate allure-results --clean -o allure-report

      - uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      - id: deploy
        uses: actions/deploy-pages@v5
